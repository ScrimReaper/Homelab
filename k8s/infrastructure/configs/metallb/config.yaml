apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: ip-pool
  namespace: metallb-system
spec:
  addresses:
    - 192.168.0.200-192.168.0.254
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: example
  namespace: metallb-system
spec:
  ipAddressPools:
    - ip-pool
  nodeSelectors:
    - matchLabels:
        kubernetes.io/hostname: jellypi
    - matchLabels:
        kubernetes.io/hostname: cherrypi
