apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nfs-provisioner-persistent
  namespace: nfs-provisioner
spec:
  interval: 30m
  chart:
    spec:
      chart: nfs-subdir-external-provisioner
      version: "4.0.18"
      sourceRef:
        kind: HelmRepository
        name: nfs-subdir-external-provisioner
        namespace: flux-system
  values:
    nfs:
      server: jellypi.ts.scrimreaper.dev
      path: /media/sandisk/persistent
      mountOptions:
        - nfsvers=4.1
        - rsize=1048576
        - wsize=1048576
        - hard
        - intr
        - timeo=14
        - retrans=2
    storageClass:
      name: nfs-persistent
      defaultClass: false
      reclaimPolicy: Retain
      pathPattern: "${.PVC.namespace}/${.PVC.name}"
      onDelete: retain
