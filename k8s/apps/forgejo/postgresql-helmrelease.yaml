apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: forgejo-postgresql
  namespace: forgejo
spec:
  interval: 30m
  chart:
    spec:
      chart: postgresql
      version: "18.6.2"
      sourceRef:
        kind: HelmRepository
        name: bitnami
        namespace: flux-system
      interval: 24h
  valuesFrom:
    - kind: Secret
      name: forgejo-db-secret
      valuesKey: PASSWD
      targetPath: auth.password
  values:
    auth:
      username: forgejo
      database: forgejo
    primary:
      containerSecurityContext:
        runAsGroup: 2000
      persistence:
        enabled: true
        storageClass: nfs-persistent
        size: 5Gi
