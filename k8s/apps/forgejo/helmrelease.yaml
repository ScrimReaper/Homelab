apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: forgejo
  namespace: forgejo
spec:
  interval: 30m
  chart:
    spec:
      chart: forgejo
      version: "16.2.2"
      sourceRef:
        kind: HelmRepository
        name: forgejo
        namespace: flux-system
  values:
    gitea:
      additionalConfigSources:
        - secret:
            secretName: forgejo-db-secret
      admin:
        existingSecret: forgejo-admin-secret

      oauth:
        - name: "Authelia"
          provider: openidConnect
          existingSecret: forgejo-oauth-secret
          autoDiscoverUrl: https://auth.scrimreaper.dev/.well-known/openid-configuration
        
      config:
        server:
          DOMAIN: git.scrimreaper.dev
          ROOT_URL: https://git.scrimreaper.dev
          SSH_DOMAIN: git.scrimreaper.dev
          SSH_PORT: 22
          SSH_LISTEN_PORT: 2222


    persistence:
      enabled: true
      storageClass: nfs-persistent
      size: 10Gi
      accessModes:
        - ReadWriteOnce

    ingress:
      enabled: true
      className: traefik
      hosts:
        - host: git.scrimreaper.dev
          paths:
            - path: /
              pathType: Prefix
      # tls: add when Cloudflare Tunnel is in place
