apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: forgejo
  namespace: forgejo
spec:
  interval: 30m
  chart:
    spec:
      chart: forgejo
      version: "16.2.2"
      sourceRef:
        kind: HelmRepository
        name: forgejo
        namespace: flux-system
  values:
    image:
      tag: 15.0.1
    gitea:
      additionalConfigSources:
        - secret:
            secretName: forgejo-db-secret
      admin:
        existingSecret: forgejo-admin-secret

      oauth:
        - name: "Authelia"
          provider: openidConnect
          existingSecret: forgejo-oauth-secret
          autoDiscoverUrl: https://auth.scrimreaper.dev/.well-known/openid-configuration

      config:
        server:
          DOMAIN: git.scrimreaper.dev
          ROOT_URL: https://git.scrimreaper.dev
          SSH_DOMAIN: git.scrimreaper.dev
          SSH_PORT: 22
          SSH_LISTEN_PORT: 2222

    containerSecurityContext:
      runAsGroup: 2000

    persistence:
      enabled: true
      storageClass: nfs-persistent
      size: 10Gi
      accessModes:
        - ReadWriteMany
