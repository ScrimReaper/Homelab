apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
    name: ghost
    namespace: ghost
spec:
    interval: 30m
    chart:
        spec:
            chart: ghost
            version: v6.36.0
            sourceRef:
                kind: HelmRepository
                name: ghost
                namespace: flux-system
            interval: 24h
    env:
      - name: database__connection__password
        valueFrom:
          secretKeyRef:
            name: ghost-mariadb-credentials
            key: mariadb-password

    values:
        image:
            tag: v6.36.0
        ghost:
            url: https://scrimreaper.dev
            adminUrl: https://scrimreaper.dev
            mail:
                enabled: false
            livenessProbe:
                enabled: true
            readinessProbe:
                enabled: true
            securityContext:
                runAsGroup: 2000
        mysql:
            enabled: false
            external:
                host: ghost-db
                user: ghost_user
                database: ghost
                password: password
                existingSecret: ghost-mariadb-credentials
        persistence:
            ghost:
                storageClassName: nfs-persistent
                accessMode: ReadWriteMany
                size: 5Gi
        ingress:
            enabled: false
