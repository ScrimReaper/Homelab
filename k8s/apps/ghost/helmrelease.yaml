apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ghost
  namespace: ghost
spec:
  interval: 30m
  chart:
    spec:
      chart: ghost
      version: "25.0.4"
      sourceRef:
        kind: HelmRepository
        name: ghost
        namespace: flux-system
      interval: 24h
  values:
    ghostHost: scrimreaper.dev
    ghostBlogTitle: Mo's Blog
    ghostUsername: mo
    ghostEmail: scrimreaperdev@proton.me
    existingSecret: ghost-credentials

    containerSecurityContext:
      runAsGroup: 2000

    service:
      type: ClusterIP
      port: 80

    ingress:
      enabled: false

    persistence:
      enabled: true
      storageClass: nfs-persistent

    mysql:
      enabled: true
      auth:
        existingSecret: ghost-mariadb-credentials
      primary:
        containerSecurityContext:
          runAsGroup: 2000
        persistence:
          enabled: true
          storageClass: nfs-persistent

