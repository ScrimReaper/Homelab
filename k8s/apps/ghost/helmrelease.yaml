apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ghost
  namespace: ghost
spec:
  interval: 30m
  chart:
    spec:
      chart: ghost
      version: "25.0.4"
      sourceRef:
        kind: HelmRepository
        name: ghost
        namespace: flux-system
      interval: 24h
  values:
    persistence:
      storageclass: nfs-persistent
    containerSecurityContext:
      runAsGroup: 2000

