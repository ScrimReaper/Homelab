apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
    name: ghost
    namespace: ghost
spec:
    interval: 30m
    chart:
        spec:
            chart: ghost-on-kubernetes
            version: 1.0.7
            sourceRef:
                kind: HelmRepository
                name: ghost
                namespace: flux-system
            interval: 24h
    valuesFrom:
      - kind: Secret
        name: ghost-mariadb-credentials
        valuesKey: values.yaml

    values:
        ghost:
            url: https://scrimreaper.dev
            adminUrl: https://scrimreaper.dev
            mail:
                enabled: false
            livenessProbe:
                enabled: true
            readinessProbe:
                enabled: true
            securityContext:
                runAsGroup: 2000
        mysql:
            enabled: false
            external:
                host: ghost-db-mariadb
                username: ghost_user
                database: ghost
        persistence:
            ghost:
                storageClassName: nfs-persistent
                accessMode: ReadWriteMany
                size: 5Gi
        ingress:
            enabled: false
