apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ghost-db
  namespace: ghost
spec:
  interval: 30m
  chart:
    spec:
      chart: mariadb
      version: "25.0.8"
      sourceRef:
        kind: HelmRepository
        name: ghost
        namespace: flux-system
      interval: 24h
  values:
    auth:
      database: bitnami_ghost
      username: bn_ghost
      existingSecret: ghost-mariadb-credentials

    primary:
      containerSecurityContext:
        runAsGroup: 2000
      persistence:
        enabled: true
        storageClass: nfs-persistent
