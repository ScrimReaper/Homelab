---
- name: ansible group
  ansible.builtin.group:
    name: "{{ automation_user }}"
    gid: 20000
    state: present

- name: ansible user
  ansible.builtin.user:
    name: "{{ automation_user }}"
    comment: Ansible Automation User
    uid: 15000
    group: "{{ automation_user }}"
    state: present
    shell: /bin/bash

- name: Set up authorized keys for ansible
  ansible.posix.authorized_key:
    user: "{{ automation_user }}"
    key: "{{ pubkeys | authorized_builder(pubkey_directory) }}"
    state: present
    exclusive: true

- name: ensure sudo exists and update cache
  ansible.builtin.package:
    name: sudo
    state: present
    update_cache: true

- name: Passwordless Sudo
  ansible.builtin.copy:
    dest: /etc/sudoers.d/{{ automation_user }}
    content: "{{ automation_user }} ALL=(ALL) NOPASSWD: ALL"
    owner: root
    group: root
    mode: "0440"
    validate: visudo -csf %s
