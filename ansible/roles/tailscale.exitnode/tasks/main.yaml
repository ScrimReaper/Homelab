---
- name: Make sure required packages are installed
  ansible.builtin.package:
    name: "{{ item }}"
    state: present
    update_cache: true
  loop:
    - wireguard
    - wireguard-tools
    - systemd-resolved

- name: Copy wireguard config
  ansible.builtin.template:
    src: "{{ proton_interface }}.conf.j2"
    dest: /etc/wireguard/{{ proton_interface }}.conf
    mode: "0600"
  notify: Restart WireGuard tunnel

- name: Enable IPv4 forwarding
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: "1"
    sysctl_set: true
    state: present
    reload: true

- name: Configure systemd-resolved fallback DNS
  ansible.builtin.lineinfile:
    path: /etc/systemd/resolved.conf
    regexp: "^#?FallbackDNS="
    line: FallbackDNS={{ resolved_fallback_dns }}
  notify: Restart systemd-resolved


- name: Enable and start systemd-resolved
  ansible.builtin.systemd:
    name: systemd-resolved
    enabled: true
    state: started

# This is usually handled by the package manager,
# it was added for consistency across different environments
- name: Point resolv.conf at systemd-resolved stub
  ansible.builtin.file:
    src: /run/systemd/resolve/stub-resolv.conf
    dest: /etc/resolv.conf
    state: link
    force: true

- name: Enable and start ProtonVPN WireGuard tunnel
  ansible.builtin.systemd:
    name: wg-quick@{{ proton_interface }}
    enabled: true
    state: started

- name: Ensure WireGuard interface is up
  ansible.builtin.stat:
    path: /sys/class/net/{{ proton_interface }}
  register: wg_iface

- name: Start WireGuard tunnel if interface is missing
  ansible.builtin.systemd:
    name: wg-quick@{{ proton_interface }}
    state: restarted
  when: not wg_iface.stat.exists
