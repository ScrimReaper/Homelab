---
- name: Gather Tailscale IPs for k3s node configuration
  hosts: k3s_cluster
  become: true
  gather_facts: false
  tasks:
    - name: Get Tailscale IPv4 address
      command: tailscale ip -4
      register: tailscale_ipv4
      changed_when: false

    - name: Set Tailscale IP as persistent host fact
      set_fact:
        k3s_tailscale_ip: "{{ tailscale_ipv4.stdout | trim }}"

- name: Import kube cluster playbook
  ansible.builtin.import_playbook: k3s.orchestration.site
