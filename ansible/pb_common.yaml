- name: Apply common configuration
  hosts: all
  become: true
  roles:
    - common

- name: Apply Firewall config
  hosts: ufw
  become: true
  roles:
    - common.ufw

- name: Apply k3s node sysctl tuning
  hosts: k3s_cluster
  become: true
  tasks:
    - name: Increase UDP receive buffer size for QUIC (cloudflared)
      ansible.posix.sysctl:
        name: "{{ item.name }}"
        value: "{{ item.value }}"
        state: present
        sysctl_file: /etc/sysctl.d/99-k3s.conf
        reload: true
      loop:
        - { name: net.core.rmem_max, value: "7500000" }
        - { name: net.core.wmem_max, value: "7500000" }
