---
# Bootstrapping

- name: Prepare all for ansible
  hosts: all
  become: true
  roles:
    - bootstrap

- name: Include common playbook
  import_playbook: pb_common.yaml

- name: Include network playbook
  import_playbook: pb_network.yaml

- name: Include Pihole playbook
  import_playbook: pb_pihole.yaml

- name: Include Headscale playbook
  import_playbook:  pb_headscale.yaml

- name: Include Tailscale playbook
  import_playbook: pb_tailscale.yaml

- name: Include storage playbook
  import_playbook: pb_storage.yaml

- name: Include k3s playbook
  import_playbook: pb_k3s.yaml
